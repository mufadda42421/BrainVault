<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="50%" stop-color="#131226"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="2"/>
  
  <!-- Neural Vault Hexagon / Brain Core -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Shield / Vault ring -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" 
      fill="none" stroke="url(#purpleGrad)" stroke-width="8" stroke-dasharray="12 6" opacity="0.6"/>
    
    <!-- Central Brain Synapse Geometry -->
    <path d="M-60,-90 C-90,-60 -100,-20 -70,20 C-90,50 -70,90 -20,95 C-10,96 -5,80 -5,60 C-30,50 -40,10 -15,0 C-40,-20 -40,-60 -20,-75 Z"
      fill="url(#purpleGrad)" opacity="0.85"/>
    <path d="M60,-90 C90,-60 100,-20 70,20 C90,50 70,90 20,95 C10,96 5,80 5,60 C30,50 40,10 15,0 C40,-20 40,-60 20,-75 Z"
      fill="url(#cyanGrad)" opacity="0.85"/>
      
    <!-- Synaptic Core Spark & Circuit Nodes -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="-50" cy="-40" r="7" fill="#38bdf8"/>
    <circle cx="50" cy="-40" r="7" fill="#c084fc"/>
    <circle cx="-40" cy="45" r="7" fill="#818cf8"/>
    <circle cx="40" cy="45" r="7" fill="#38bdf8"/>
    <circle cx="0" cy="-80" r="6" fill="#f43f5e"/>
    <circle cx="0" cy="80" r="6" fill="#a855f7"/>

    <!-- Connecting neural lines -->
    <line x1="0" y1="0" x2="-50" y2="-40" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    <line x1="0" y1="0" x2="50" y2="-40" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    <line x1="0" y1="0" x2="-40" y2="45" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    <line x1="0" y1="0" x2="40" y2="45" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="80" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
  </g>
</svg>
